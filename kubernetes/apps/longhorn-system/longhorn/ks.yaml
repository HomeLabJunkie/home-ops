---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
spec:
  interval: 1h
  path: ./kubernetes/apps/longhorn-system/longhorn/app
  postBuild:
    substitute:
      # Every request to longhorn.jeffriffle.com is checked by Authelia first
      # (Authelia rule: group admins, two_factor). The app's own Authorization
      # header is not sent to Authelia.
      AUTHELIA_ROUTE: longhorn
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: longhorn-system
  wait: true
  timeout: 15m
---
# Longhorn custom resources (the backup schedule). Separate from the chart's
# Kustomization because their CRDs only exist once the chart is installed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
spec:
  dependsOn:
    - name: longhorn
  interval: 1h
  path: ./kubernetes/apps/longhorn-system/longhorn/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: longhorn-system
