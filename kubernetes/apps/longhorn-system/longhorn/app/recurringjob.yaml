---
# Nightly backup of every volume in the "default" group (volumes with no
# recurring job of their own) to the NAS; keep 14 per volume.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-nightly
spec:
  task: backup
  cron: "37 2 * * *"
  groups:
    - default
  retain: 14
  concurrency: 2
