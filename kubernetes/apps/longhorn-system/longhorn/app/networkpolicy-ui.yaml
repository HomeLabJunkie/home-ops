---
# The Longhorn UI (and the manager API it proxies) has no login of its own;
# Authelia guards only the HTTPRoute, so only the external Envoy may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
      ports:
        - port: 8000
          protocol: TCP
