---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Headlamp
    gethomepage.dev/group: Talos cluster
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/headlamp.svg
    gethomepage.dev/description: Kubernetes UI
    gethomepage.dev/pod-selector: app.kubernetes.io/name=headlamp
spec:
  hostnames: ["headlamp.jeffriffle.com"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
