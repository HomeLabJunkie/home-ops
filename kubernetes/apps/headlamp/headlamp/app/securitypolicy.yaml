---
# Every request to headlamp.jeffriffle.com is checked by Authelia first
# (Authelia rule: group admins, two_factor). The app's own Authorization
# header is not sent to Authelia.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: headlamp-authelia
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headlamp
  extAuth:
    failOpen: false
    headersToExtAuth: [accept, cookie, proxy-authorization, x-forwarded-proto]
    http:
      backendRefs:
        - name: authelia
          port: 9091
      path: /api/authz/ext-authz/
      headersToBackend: [remote-user, remote-groups, remote-name, remote-email]
