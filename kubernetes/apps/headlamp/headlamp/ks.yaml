---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
spec:
  interval: 1h
  path: ./kubernetes/apps/headlamp/headlamp/app
  postBuild:
    substitute:
      # Every request to headlamp.jeffriffle.com is checked by Authelia first
      # (Authelia rule: group admins, two_factor). The app's own Authorization
      # header is not sent to Authelia.
      AUTHELIA_ROUTE: headlamp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: headlamp
  wait: true
  timeout: 15m
