---
# Cluster-admin identity for the Nautik app on Jeff's iPhone, which reaches
# https://192.168.1.209:6443 over the tailnet (unraid advertises
# 192.168.0.0/23). Long-lived token in the Secret below, filled in by
# Kubernetes; only the empty Secret is in git. Build the phone's kubeconfig
# in your own terminal, never print the token.
# Revoke: delete the Secret (Flux recreates it with a NEW token, the old one
# stops working at once). Cut access for good: remove this app from git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nautik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nautik-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: nautik
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: nautik-token
  annotations:
    kubernetes.io/service-account.name: nautik
type: kubernetes.io/service-account-token
