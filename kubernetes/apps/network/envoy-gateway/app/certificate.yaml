---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "jeffriffle-com-production"
spec:
  dnsNames:
    - "jeffriffle.com"
    - "*.jeffriffle.com"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "jeffriffle-com-production-tls"
  usages:
    - digital signature
