---
# Every ExternalSecret in the cluster reads from this store: one Bitwarden
# Secrets Manager project, through a machine account that can only read it.
# The IDs below identify the organization and project; they grant nothing.
# The access token is the one secret that is put into the cluster by hand
# (see bootstrap/kustomize).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      organizationID: ba9d71fb-179b-42b0-bb6f-b291010c87d4
      projectID: 279ec98e-312e-4af0-b04e-b50300f7c981
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            namespace: external-secrets
            key: token
