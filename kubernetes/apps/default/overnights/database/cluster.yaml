---
# PostgreSQL for overnights: two instances on different nodes, WAL archived
# continuously and base backups daily to Garage S3 (objectstore.yaml).
# No initdb secret: CloudNativePG generates the owner's credentials in the
# Secret "overnights-postgres-app" (key "uri" is the app's DATABASE_URL).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: overnights-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:37fdeea29a4d3ed14570f719488ba55bd21e8975eaea864be5ce74d25a9a13de
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  storage:
    size: 2Gi
    storageClass: longhorn-staging
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: overnights-s3
  bootstrap:
    initdb:
      database: overnights
      owner: overnights
