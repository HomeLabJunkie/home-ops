---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: overnights-postgres
spec:
  schedule: "0 15 3 * * *" # daily 03:15 (seconds first)
  immediate: true
  backupOwnerReference: self
  method: plugin
  # From the primary: it closes the backup's last WAL file and waits for it to
  # upload. From a standby on an idle database that file stayed open, so the
  # backup couldn't be restored until the next write (restore drill 2026-11-17)
  target: primary
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: overnights-postgres
