---
# Pull credentials for the private image ghcr.io/homelabjunkie/overnights
# (same read-only GHCR token as fb-search)
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overnights-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: overnights-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"HomeLabJunkie","password":"{{ .GHCR_READ_TOKEN }}"}}}
  data:
    - secretKey: GHCR_READ_TOKEN
      remoteRef:
        key: GHCR_READ_TOKEN
