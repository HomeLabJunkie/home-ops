---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/authelia-gate
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./securitypolicy.yaml
# Homepage's whole config is these files (services.yaml and settings.yaml are
# generated by scripts/homepage.py from ../inventory.yaml). Reloader restarts
# the pod when they change.
configMapGenerator:
  - name: homepage-config
    files:
      - ./config/services.yaml
      - ./config/settings.yaml
      - ./config/widgets.yaml
      - ./config/kubernetes.yaml
      - ./config/bookmarks.yaml
      - ./config/docker.yaml
      - ./config/proxmox.yaml
      - ./config/custom.css
      - ./config/custom.js
generatorOptions:
  disableNameSuffixHash: true
