---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/authelia-gate
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
# Homepage's config, except services.yaml and settings.yaml, which come from
# the private repo (ConfigMap homepage-private). Reloader restarts the pod when
# either ConfigMap changes.
configMapGenerator:
  - name: homepage-config
    files:
      - ./config/widgets.yaml
      - ./config/kubernetes.yaml
      - ./config/bookmarks.yaml
      - ./config/docker.yaml
      - ./config/proxmox.yaml
      - ./config/custom.css
      - ./config/custom.js
generatorOptions:
  disableNameSuffixHash: true
