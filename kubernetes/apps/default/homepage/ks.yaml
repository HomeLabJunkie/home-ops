---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
spec:
  dependsOn:
    - name: homepage-private
  interval: 1h
  path: ./kubernetes/apps/default/homepage/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: true
  timeout: 10m
---
# services.yaml and settings.yaml: the list of services outside the cluster,
# with LAN addresses, from the private repo (see flux-system/private-repo)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage-private
spec:
  dependsOn:
    - name: private-repo
      namespace: flux-system
  interval: 1h
  path: ./homepage/kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops-private
    namespace: flux-system
  targetNamespace: default
  # The private repo only supplies one ConfigMap, so apply it with an
  # identity that can manage ConfigMaps here and nothing else.
  serviceAccountName: homepage-private-reconciler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage-private-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homepage-private-reconciler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homepage-private-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homepage-private-reconciler
subjects:
  - kind: ServiceAccount
    name: homepage-private-reconciler
