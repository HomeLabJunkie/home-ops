---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/default/vaultwarden/app
  postBuild:
    substitute:
      # Requests to vaultwarden.jeffriffle.com/admin are checked by Authelia first
      # (Authelia rule: group admins, two_factor), then Vaultwarden asks for its
      # admin token. The vault itself (route "vaultwarden") has no Authelia.
      AUTHELIA_ROUTE: vaultwarden-admin
      APP: vaultwarden
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
