---
# Vaultwarden: the password manager server (Bitwarden-compatible). Data
# (SQLite, rsa_key.pem, icon cache) lives on the "vaultwarden" PVC, backed up
# hourly by Kopiur. The Bitwarden apps keep an offline copy of the vault, so
# a cluster outage means read-only access, not lockout.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  chartRef:
    kind: OCIRepository
    name: vaultwarden
  interval: 1h
  values:
    controllers:
      vaultwarden:
        strategy: Recreate # SQLite on a ReadWriteOnce volume: never two pods
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/vaultwarden/server
              tag: 1.37.5
            env:
              TZ: America/Chicago
              DATA_FOLDER: /data
              DOMAIN: https://vaultwarden.jeffriffle.com
              ROCKET_PORT: &port 8080
              SIGNUPS_ALLOWED: "false"
              INVITATIONS_ALLOWED: "false"
              SMTP_HOST: smtp.gmail.com
              SMTP_PORT: "587"
              SMTP_SECURITY: starttls
              SMTP_FROM_NAME: Vaultwarden
            envFrom:
              - secretRef:
                  name: vaultwarden-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      # The vault, used by the Bitwarden apps and browser extensions: no
      # Authelia here (the apps cannot follow its login redirect); Vaultwarden
      # has its own login with two-factor.
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Vaultwarden
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: vaultwarden.svg
          gethomepage.dev/description: passwords
          gethomepage.dev/pod-selector: app.kubernetes.io/name=vaultwarden
        hostnames:
          - vaultwarden.jeffriffle.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      # The admin page, behind Authelia (securitypolicy.yaml). A longer path
      # match wins, so /admin always goes through this route.
      admin:
        hostnames:
          - vaultwarden.jeffriffle.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /admin
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
