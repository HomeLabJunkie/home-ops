---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: vaultwarden-secret
    template:
      data:
        ADMIN_TOKEN: "{{ .ADMIN_TOKEN }}"
        SMTP_USERNAME: "{{ .SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
        SMTP_FROM: "{{ .SMTP_USERNAME }}" # mail goes out from the SMTP account itself
        YUBICO_CLIENT_ID: "{{ .YUBICO_CLIENT_ID }}"
        YUBICO_SECRET_KEY: "{{ .YUBICO_SECRET_KEY }}"
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: VAULTWARDEN_ADMIN_TOKEN
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: VAULTWARDEN_SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: VAULTWARDEN_SMTP_PASSWORD
    - secretKey: YUBICO_CLIENT_ID
      remoteRef:
        key: VAULTWARDEN_YUBICO_CLIENT_ID
    - secretKey: YUBICO_SECRET_KEY
      remoteRef:
        key: VAULTWARDEN_YUBICO_SECRET_KEY
