---
# Requests to vaultwarden.jeffriffle.com/admin are checked by Authelia first
# (Authelia rule: group admins, two_factor), then Vaultwarden asks for its
# admin token. The vault itself (route "vaultwarden") has no Authelia.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: vaultwarden-admin-authelia
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: vaultwarden-admin
  extAuth:
    failOpen: false
    headersToExtAuth: [accept, cookie, proxy-authorization, x-forwarded-proto]
    http:
      backendRefs:
        - name: authelia
          port: 9091
      path: /api/authz/ext-authz/
      headersToBackend: [remote-user, remote-groups, remote-name, remote-email]
