---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/default/trilium/app
  postBuild:
    substitute:
      # Every request to trilium.jeffriffle.com is checked by Authelia first
      # (Authelia rule: group admins, two_factor), then Trilium asks for its own
      # password. Sync between Trilium instances uses the LAN service instead.
      AUTHELIA_ROUTE: trilium
      APP: trilium
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
