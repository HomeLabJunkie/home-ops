---
# Trilium Notes (TriliumNext): personal knowledge base and the sync server for
# the other Trilium instances. Data (SQLite, attachments, Trilium's own
# backups) lives on the "trilium" PVC, backed up hourly by Kopiur.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trilium
spec:
  chartRef:
    kind: OCIRepository
    name: trilium
  interval: 1h
  values:
    controllers:
      trilium:
        strategy: Recreate # SQLite on a ReadWriteOnce volume: never two pods
        containers:
          app:
            image:
              repository: ghcr.io/triliumnext/trilium
              tag: v0.107.0
            env:
              TZ: America/Chicago
              TRILIUM_DATA_DIR: /home/node/trilium-data
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health-check
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
      # LAN-only sync endpoint for the other Trilium instances (they sync with
      # Trilium's own login; Authelia can't sit in front of the sync API)
      sync:
        controller: trilium
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.1.19
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Trilium
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: trilium.svg
          gethomepage.dev/description: notes
          gethomepage.dev/pod-selector: app.kubernetes.io/name=trilium
        hostnames:
          - trilium.jeffriffle.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node/trilium-data
      tmp:
        type: emptyDir
