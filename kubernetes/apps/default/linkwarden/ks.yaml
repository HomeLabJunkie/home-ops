---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkwarden-database
spec:
  components:
    - ../../../../components/cnpg
  dependsOn:
    - name: barman-cloud
      namespace: cnpg-system
    - name: longhorn
      namespace: longhorn-system
    - name: lan-services
      namespace: network
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: linkwarden-postgres
      namespace: default
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/linkwarden/database
  postBuild:
    substitute:
      APP: linkwarden
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkwarden
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: linkwarden-database
    - name: kopiur-repository
      namespace: kopiur-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: linkwarden
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/linkwarden/app
  postBuild:
    substitute:
      # Every request to linkwarden.jeffriffle.com is checked by Authelia first
      # (Authelia rule: group admins, two_factor), then Linkwarden asks for its own
      # login.
      # app-template names routes <release>-<id> once there are two.
      AUTHELIA_ROUTE: linkwarden-app
      APP: linkwarden
      # Doubled from the 5Gi default on 2026-11-27 (was 89% full); also sizes
      # the kopiur mover cache
      KOPIUR_CAPACITY: 10Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
