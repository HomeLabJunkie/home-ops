---
# Backups to s3://cnpg/linkwarden on Garage (unraid). Garage wants region
# "garage" and doesn't support the newer AWS checksum headers.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: linkwarden-s3
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://cnpg/linkwarden
    endpointURL: http://192.168.1.9:3900
    s3Credentials:
      accessKeyId:
        name: linkwarden-postgres-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: linkwarden-postgres-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: garage
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
