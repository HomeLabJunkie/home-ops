---
# Owner credentials for the "linkwarden" database (CloudNativePG initdb)
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: linkwarden-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: linkwarden
        password: "{{ .LINKWARDEN_POSTGRES_PASSWORD }}"
  data:
    - secretKey: LINKWARDEN_POSTGRES_PASSWORD
      remoteRef:
        key: LINKWARDEN_POSTGRES_PASSWORD
---
# Garage S3 key "cnpg-prodesk" (bucket "cnpg") for Barman Cloud
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-postgres-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: linkwarden-postgres-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: CNPG_S3_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: CNPG_S3_SECRET_ACCESS_KEY
