---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: linkwarden-secret
    template:
      data:
        NEXTAUTH_SECRET: "{{ .LINKWARDEN_NEXTAUTH_SECRET }}"
        DATABASE_URL: "postgresql://linkwarden:{{ .LINKWARDEN_POSTGRES_PASSWORD }}@linkwarden-postgres-rw.default.svc.cluster.local:5432/linkwarden"
  data:
    - secretKey: LINKWARDEN_NEXTAUTH_SECRET
      remoteRef:
        key: LINKWARDEN_NEXTAUTH_SECRET
    - secretKey: LINKWARDEN_POSTGRES_PASSWORD
      remoteRef:
        key: LINKWARDEN_POSTGRES_PASSWORD
