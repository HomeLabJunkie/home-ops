# One JSON line per request, for the jeffriffle.com Grafana dashboard (Loki).
# Cloudflare adds CF-Connecting-IP (the visitor's address) and CF-IPCountry.
log_format site escape=json '{"time":"$time_iso8601","ip":"$http_cf_connecting_ip",'
  '"country":"$http_cf_ipcountry","method":"$request_method","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"referer":"$http_referer",'
  '"ua":"$http_user_agent","rt":$request_time}';

server {
  listen 8080;
  server_name _;
  root /git/current;
  index index.html;
  # Traefik terminates TLS, so keep redirects relative
  absolute_redirect off;
  server_tokens off;
  access_log /dev/stdout site;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # The git-sync worktree holds a .git pointer file; never serve dotfiles
  location ~ /\. {
    return 404;
  }

  # The editor itself holds no secrets (it signs in to GitHub with a token),
  # but keep it out of caches and search results. Cloudflare Access guards the path.
  location /admin/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
  }
}
