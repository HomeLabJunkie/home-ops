---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: website
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: website-git-secret
  data:
    # Read-only deploy key on HomeLabJunkie/jeffriffle.com
    - secretKey: ssh
      remoteRef:
        key: WEBSITE_GITHUB_DEPLOY_KEY
