---
# fb-search (jeffriffle.com/fb-search): a small FastAPI app that searches
# Facebook Marketplace with a headless Chromium (Playwright). Source:
# HomeLabJunkie/fb-marketplace-hunter.
# The image is built by GitHub Actions in that repo on every merge to main
# (ghcr.io/homelabjunkie/fb-search, private; pulled with fb-search-ghcr).
# Single replica on purpose: the login lockout and the one-search-at-a-time
# lock live in memory.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fb-search
spec:
  chartRef:
    kind: OCIRepository
    name: fb-search
  interval: 1h
  values:
    controllers:
      fb-search:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homelabjunkie/fb-search
              tag: 529f1371a3c44b6d0829ef294aed16c122accb64@sha256:3b69feebf221c0ff9becda69d8e8fad10e702a83c244d1ed03c3e811d91ca2b8
            env:
              MARKETPLACE_LOCATION: Bellevue, NE
              FB_SLUG_CACHE: /cache/slugs.json
              METRICS_PORT: &metrics 9100
            envFrom:
              - secretRef:
                  name: fb-search-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /fb-search/healthz
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
              limits:
                cpu: "1"
                memory: 1536Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: fb-search-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: fb-search
        ports:
          http:
            port: *port
          metrics:
            port: *metrics
    serviceMonitor:
      app:
        serviceName: fb-search
        endpoints:
          - port: metrics
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: fb-search
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: facebook.svg
          gethomepage.dev/description: Marketplace search
          gethomepage.dev/href: https://jeffriffle.com/fb-search
          gethomepage.dev/pod-selector: app.kubernetes.io/name=fb-search
        hostnames:
          - jeffriffle.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /fb-search
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      cache:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          fb-search:
            app: [{ path: /cache }]
      tmp:
        type: emptyDir
        sizeLimit: 512Mi
        advancedMounts:
          fb-search:
            app: [{ path: /tmp }]
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          fb-search:
            app: [{ path: /dev/shm }]
