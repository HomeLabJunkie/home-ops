---
# fb-search (jeffriffle.com/fb-search): a small FastAPI app that searches
# Facebook Marketplace with a headless Chromium (Playwright). Source:
# HomeLabJunkie/fb-marketplace-hunter.
# For now it runs like it did on Unraid: init containers clone the repo and
# install the pinned, hash-checked requirements into a scratch volume, then
# the app runs in Microsoft's Playwright image (it ships Chromium). A
# purpose-built image will replace this.
# Single replica on purpose: the login lockout and the one-search-at-a-time
# lock live in memory.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fb-search
spec:
  chartRef:
    kind: OCIRepository
    name: fb-search
  interval: 1h
  values:
    controllers:
      fb-search:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          git-clone:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.8.0
            args:
              - --repo=git@github.com:HomeLabJunkie/fb-marketplace-hunter.git
              - --ref=main
              - --depth=1
              - --root=/src
              - --link=current
              - --ssh-key-file=/etc/git-secret/ssh
              - --ssh-known-hosts-file=/etc/git-known-hosts/known_hosts
              - --git-config=safe.directory:/src
              - --one-time
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          pip-install:
            image: &playwright
              repository: mcr.microsoft.com/playwright/python
              tag: v1.63.0-noble
            command:
              - pip
              - install
              - --no-cache-dir
              - --require-hashes
              - --target=/deps
              - --requirement=/src/current/requirements.txt
            env:
              HOME: /tmp
            securityContext: *securityContext
        containers:
          app:
            image: *playwright
            workingDir: /src/current
            command:
              - python
              - -m
              - uvicorn
              - webapp:app
              - --host=0.0.0.0
              - --port=8000
              - --proxy-headers
              - --forwarded-allow-ips=*
            env:
              HOME: /tmp
              PYTHONPATH: /deps
              MARKETPLACE_LOCATION: Bellevue, NE
              FB_SLUG_CACHE: /cache/slugs.json
              METRICS_PORT: &metrics 9100
            envFrom:
              - secretRef:
                  name: fb-search-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /fb-search/healthz
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
              limits:
                cpu: "1"
                memory: 1536Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: fb-search
        ports:
          http:
            port: *port
          metrics:
            port: *metrics
    serviceMonitor:
      app:
        serviceName: fb-search
        endpoints:
          - port: metrics
    route:
      app:
        hostnames:
          - jeffriffle.com
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /fb-search
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      cache:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          fb-search:
            app: [{ path: /cache }]
      src:
        type: emptyDir
        advancedMounts:
          fb-search:
            git-clone: [{ path: /src }]
            pip-install: [{ path: /src, readOnly: true }]
            app: [{ path: /src, readOnly: true }]
      deps:
        type: emptyDir
        advancedMounts:
          fb-search:
            pip-install: [{ path: /deps }]
            app: [{ path: /deps, readOnly: true }]
      git-secret:
        type: secret
        name: fb-search-secret
        defaultMode: 0400
        items:
          - key: ssh
            path: ssh
        advancedMounts:
          fb-search:
            git-clone: [{ path: /etc/git-secret, readOnly: true }]
      known-hosts:
        type: configMap
        name: fb-search-known-hosts
        advancedMounts:
          fb-search:
            git-clone: [{ path: /etc/git-known-hosts, readOnly: true }]
      tmp:
        type: emptyDir
        sizeLimit: 512Mi
        advancedMounts:
          fb-search:
            git-clone: [{ path: /tmp }]
            pip-install: [{ path: /tmp }]
            app: [{ path: /tmp }]
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          fb-search:
            app: [{ path: /dev/shm }]
