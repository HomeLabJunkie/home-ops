---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fb-search
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: fb-search-secret
    template:
      data:
        APP_PASSWORD: "{{ .FB_SEARCH_APP_PASSWORD }}"
        SESSION_SECRET: "{{ .FB_SEARCH_SESSION_SECRET }}"
  data:
    - secretKey: FB_SEARCH_APP_PASSWORD
      remoteRef:
        key: FB_SEARCH_APP_PASSWORD
    - secretKey: FB_SEARCH_SESSION_SECRET
      remoteRef:
        key: FB_SEARCH_SESSION_SECRET
---
# Pull credentials for the private image ghcr.io/homelabjunkie/fb-search:
# a classic GitHub token with only the read:packages scope
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fb-search-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: fb-search-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"HomeLabJunkie","password":"{{ .GHCR_READ_TOKEN }}","auth":"{{ printf "HomeLabJunkie:%s" .GHCR_READ_TOKEN | b64enc }}"}}}
  data:
    - secretKey: GHCR_READ_TOKEN
      remoteRef:
        key: GHCR_READ_TOKEN
