---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Goldilocks
    gethomepage.dev/group: Talos cluster
    gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/kubernetes.svg
    gethomepage.dev/description: Resource request suggestions
    gethomepage.dev/pod-selector: app.kubernetes.io/name=goldilocks,app.kubernetes.io/component=dashboard
spec:
  hostnames: ["goldilocks.jeffriffle.com"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: goldilocks-dashboard
          port: 80
