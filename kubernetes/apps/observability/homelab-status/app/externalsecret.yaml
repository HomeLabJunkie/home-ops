---
# The restricted SSH key the report uses on unraid and pi5. On both hosts the
# key only runs the read-only report script (forced command, `restrict`,
# from= the six node IPs); see ../hosts/README.md.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-status-ssh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: homelab-status-ssh
    template:
      engineVersion: v2
      data:
        # OpenSSH only loads a private key that ends with a newline; the
        # stored value has none
        id_ed25519: "{{ .HOMELAB_STATUS_SSH_KEY | trim }}\n"
  data:
    - secretKey: HOMELAB_STATUS_SSH_KEY
      remoteRef:
        key: HOMELAB_STATUS_SSH_KEY
