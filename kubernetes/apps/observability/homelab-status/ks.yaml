---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-status
spec:
  dependsOn:
    - name: kube-prometheus-stack
    - name: bitwarden
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/observability/homelab-status/app
  postBuild:
    substitute:
      # status.jeffriffle.com is checked by Authelia first (covered by the
      # *.jeffriffle.com rule: group admins, two_factor).
      AUTHELIA_ROUTE: homelab-status
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
  timeout: 10m
