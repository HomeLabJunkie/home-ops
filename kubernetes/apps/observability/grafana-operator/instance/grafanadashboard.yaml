---
# Our own: pod logs from VictoriaLogs with namespace/pod/container/search
# filters. Edit dashboards/logs.json; its ConfigMap opts out of Flux
# substitution (kustomization.yaml) so $namespace etc. survive.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: logs
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: grafana-dashboard-logs
    key: logs.json
