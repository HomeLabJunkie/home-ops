---
# Grafana trusts the Remote-User header (auth proxy), so only the external
# Envoy (which sets it from Authelia) may reach it, plus Prometheus and
# grafana-operator in this namespace (basic auth / metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-operator
      ports:
        - port: 3000
          protocol: TCP
