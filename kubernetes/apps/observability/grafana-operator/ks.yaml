---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
spec:
  dependsOn:
    - name: grafana-operator
    - name: kube-prometheus-stack
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/observability/grafana-operator/instance
  postBuild:
    substitute:
      # Every request to grafana.jeffriffle.com is checked by Authelia first
      # (Authelia rule: group admins, two_factor). The app's own Authorization
      # header is not sent to Authelia.
      AUTHELIA_ROUTE: grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
  timeout: 15m
