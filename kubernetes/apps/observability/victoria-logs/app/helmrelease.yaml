---
# Log store (modeled on onedr0p/home-ops). Logs arrive from
# victoria-logs-collector; search them in Grafana (VictoriaLogs datasource).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        storageClassName: longhorn-nobackup
        size: 20Gi
      retentionPeriod: 30d
      retentionDiskSpaceUsage: 18GiB
      serviceMonitor:
        enabled: true
