---
# VictoriaLogs holds every pod and Talos log and has no login, so only the
# log shippers (incl. the k8s-events collector), Grafana and Prometheus may
# reach it. vector runs on the host network, so it arrives as the host / remote-node entity (Cilium-only rule).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-single
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: victoria-logs-collector
        - matchLabels:
            app.kubernetes.io/name: k8s-events-collector
        - matchLabels:
            app: grafana
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
