---
# Alertmanager's whole configuration: every alert goes to one inbox by email.
# The SMTP login and the addresses come from Bitwarden.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-email
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-email
    template:
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_from: "Alertmanager prodesk <{{ .ALERTMANAGER_SMTP_USERNAME }}>"
            smtp_smarthost: smtp.gmail.com:587
            smtp_auth_username: "{{ .ALERTMANAGER_SMTP_USERNAME }}"
            smtp_auth_password: "{{ .ALERTMANAGER_SMTP_PASSWORD }}"
            smtp_require_tls: true
          route:
            receiver: email
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: "null"
                matchers:
                  - alertname =~ "Watchdog|InfoInhibitor"
          inhibit_rules:
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity =~ "warning|info"']
              equal: ["namespace", "alertname"]
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: ["namespace", "alertname"]
            - source_matchers: ['alertname = "InfoInhibitor"']
              target_matchers: ['severity = "info"']
              equal: ["namespace"]
            - target_matchers: ['alertname = "InfoInhibitor"']
          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: "{{ .ALERTMANAGER_EMAIL_TO }}"
                  send_resolved: true
  data:
    - secretKey: ALERTMANAGER_SMTP_USERNAME
      remoteRef:
        key: ALERTMANAGER_SMTP_USERNAME
    - secretKey: ALERTMANAGER_SMTP_PASSWORD
      remoteRef:
        key: ALERTMANAGER_SMTP_PASSWORD
    - secretKey: ALERTMANAGER_EMAIL_TO
      remoteRef:
        key: ALERTMANAGER_EMAIL_TO
