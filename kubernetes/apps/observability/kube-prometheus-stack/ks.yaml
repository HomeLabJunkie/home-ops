---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  path: ./kubernetes/apps/observability/kube-prometheus-stack/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
  timeout: 15m
---
# alertmanager.jeffriffle.com behind Authelia (the authelia-gate component).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alertmanager-route
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/kube-prometheus-stack/route
  postBuild:
    substitute:
      # Every request to alertmanager.jeffriffle.com is checked by Authelia first
      # (Authelia rule: group admins, two_factor). The app's own Authorization
      # header is not sent to Authelia.
      AUTHELIA_ROUTE: alertmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
  timeout: 15m
