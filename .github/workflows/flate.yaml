---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flate"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # no checkout, so changed files come from the pull request API
    outputs:
      any-changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            kubernetes/apps/**
            kubernetes/components/**
            .github/flate/**
            .github/scripts/check-kopiur-callers.py

  flate:
    if: ${{ needs.filter.outputs.any-changed == 'true' }}
    needs: filter
    name: Flate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0

      - name: Run Flate
        # The action sets FLATE_BASE, which limits the test to resources that
        # changed. Testing everything takes seconds and avoids a false failure
        # when a Kustomization changes but the HelmRelease it health-checks
        # does not ("still Pending: waiting for declaration", flate 0.7.3).
        run: env -u FLATE_BASE flate test all -p ./kubernetes/apps --supply .github/flate/supply.yaml

      - name: Check Kopiur backup callers
        # Apps that include components/kopiur/backup: APP, dependencies, the
        # PVC the workload mounts (errors) and the user it runs as (warning).
        shell: bash
        run: |
          env -u FLATE_BASE flate build all -p ./kubernetes/apps --supply .github/flate/supply.yaml \
            | yq -o=json -I=0 '.' \
            | python3 .github/scripts/check-kopiur-callers.py

  success:
    if: ${{ !cancelled() }}
    needs: [filter, flate]
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
