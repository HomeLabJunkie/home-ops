---
# Fails a PR when Homepage's generated config (services.yaml, settings.yaml)
# is out of date with kubernetes/apps/default/homepage/inventory.yaml.
# Fix: python3 scripts/homepage.py, then commit the result.
# Runs on every PR (no path filter) because it is a required check.
name: Homepage config

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  generated:
    name: Homepage config is regenerated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install oxfmt (pinned and checksummed by .mise/mise.lock)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: node oxfmt lefthook
      - name: Regenerate
        run: python3 scripts/homepage.py # PyYAML ships with the Ubuntu runner
      - name: Must match the commit
        run: |
          if ! git status --porcelain | grep -q .; then echo "In sync."; exit 0; fi
          git status --short
          echo "::error::Homepage config is out of date: run python3 scripts/homepage.py and commit"
          exit 1
