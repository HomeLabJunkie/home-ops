---
# The Cloudflare tunnel's ID, substituted into the tunnel's DNSEndpoint
# (kubernetes/apps/network/cloudflare-tunnel). Not a credential, but kept out of
# this public repo like onedr0p does.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-id-secret
stringData:
  CLOUDFLARE_TUNNEL_ID: "{{ ENV.CLOUDFLARE_TUNNEL_ID }}"
