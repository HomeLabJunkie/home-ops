[tasks.apply-node]
description = "Apply Talos config to a node"
extends = "node"
usage = '''
arg "<node>" help="Node to apply the config to"
arg "[args]" var=#true help="Extra arguments for talosctl apply-config"
'''
confirm = { message = "Apply Talos config to {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
config="$(mise run //talos:render-config "$usage_node")"
printf '%s\n' "$config" | talosctl -n "$usage_node" apply-config -f /dev/stdin "${args[@]}"
'''

[tasks.download-image]
description = "Download Talos machine image"
extends = "node"
usage = '''
arg "<version>" help="Talos version"
arg "[node]" help="Node whose schematic to use, instead of the shared schematic"
'''
run = '''
schematic="$(mise run //talos:schematic-id "${usage_node:-}")"
curl -fL --remove-on-error --retry 5 --retry-delay 5 --retry-all-errors --progress-bar \
    -o "talos-${usage_version}-${schematic:0:8}.iso" \
    "https://factory.talos.dev/image/${schematic}/${usage_version}/metal-amd64.iso"
mise run //:log info "Downloaded Talos" version "$usage_version" schematic "$schematic"
'''

[tasks.reboot-node]
description = "Reboot a node"
extends = "node"
usage = 'arg "<node>" help="Node to reboot"'
confirm = { message = "Reboot node {{ usage.node }}?", default = "no" }
run = 'talosctl -n "$usage_node" reboot -m powercycle'

[tasks.render-config]
description = "Render Talos config for a node"
extends = "node"
usage = 'arg "<node>" help="Node to render the config for"'
run = '''
schematic="$(mise run //talos:schematic-id "$usage_node")"
role="controlplane"
if [[ -f "nodes/workers/${usage_node}.yaml.j2" ]]; then
    role="workers"
fi
cluster="$(mise run //:template cluster.yaml.j2 -D "schematic=${schematic}")"
role_patch="$(mise run //:template "${role}.yaml.j2")"
node_patch="$(mise run //:template "nodes/${role}/${usage_node}.yaml.j2")"
talosctl machineconfig patch <(printf '%s\n' "$cluster") \
    -p @<(printf '%s\n' "$role_patch") \
    -p @<(printf '%s\n' "$node_patch")
'''

[tasks.reset-node]
description = "Reset a node (keeps the Longhorn data disk)"
extends = "node"
usage = '''
arg "<node>" help="Node to reset"
arg "[args]" var=#true help="Extra arguments for talosctl reset"
'''
confirm = { message = "Reset node {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
talosctl -n "$usage_node" reset --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL --graceful=false "${args[@]}"
'''

[tasks.shutdown-node]
description = "Shutdown a node"
extends = "node"
usage = '''
arg "<node>" help="Node to shut down"
arg "[args]" var=#true help="Extra arguments for talosctl shutdown"
'''
confirm = { message = "Shutdown node {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
talosctl -n "$usage_node" shutdown --force "${args[@]}"
'''

[tasks.upgrade-k8s]
description = "Upgrade Kubernetes version on the cluster"
usage = 'arg "<version>" help="Kubernetes version"'
confirm = { message = "Upgrade Kubernetes to {{ usage.version }}?", default = "no" }
run = '''
controller="$(talosctl config info -o yaml | yq -r -e '.endpoints[0]')"
talosctl -n "$controller" upgrade-k8s --to "$usage_version"
'''

[tasks.upgrade-node]
description = "Upgrade Talos version on a node"
extends = "node"
usage = '''
arg "<node>" help="Node to upgrade"
arg "[args]" var=#true help="Extra arguments for talosctl upgrade"
'''
confirm = { message = "Upgrade node {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
image="$(mise run //talos:machine-image "$usage_node")"
talosctl -n "$usage_node" upgrade -i "$image" -m powercycle --timeout=10m "${args[@]}"
'''

[tasks.schematic-file]
hide = true
usage = 'arg "[node]"'
run = '''
file="schematic.yaml.j2"
if [[ -n "${usage_node:-}" ]]; then
    for f in nodes/*/"${usage_node}".schematic.yaml.j2; do
        [[ -f "$f" ]] && file="$f"
    done
fi
echo "$file"
'''

[tasks.schematic-id]
hide = true
usage = 'arg "[node]"'
run = '''
file="$(mise run //talos:schematic-file "${usage_node:-}")"
schematic="$(mise run //:template "$file")"
printf '%s\n' "$schematic" | curl -fsSX POST --data-binary @- "https://factory.talos.dev/schematics" | jq -er '.id'
'''

[tasks.machine-image]
hide = true
usage = 'arg "[node]"'
run = '''
schematic="$(mise run //talos:schematic-id "${usage_node:-}")"
mise run //:template cluster.yaml.j2 -D "schematic=${schematic}" | yq -r -e 'select(.kind == "UnattendedInstallConfig") | .installer.image'
'''

# Creates the cluster's identity: Talos and Kubernetes CAs, tokens and the
# etcd encryption key. They go straight into Bitwarden Secrets Manager and are
# never written to this repo or printed. Refuses to run when the project
# already holds any: replacing them cuts off access to a running cluster.
[tasks.gen-identity]
description = "Generate a new cluster identity into Bitwarden Secrets Manager"
confirm = { message = "Generate a NEW cluster identity into Bitwarden?", default = "no" }
usage = 'arg "[project]" default="prodesk-talos" help="Bitwarden Secrets Manager project name"'
run = '''
if [[ -z "${BWS_ACCESS_TOKEN:-}" ]]; then
    BWS_ACCESS_TOKEN="$(<"${BWS_ACCESS_TOKEN_FILE:-$HOME/.config/bws/access-token}")"
    export BWS_ACCESS_TOKEN
fi
project_id="$(bws project list -o json | jq -er --arg n "$usage_project" '.[] | select(.name == $n) | .id')"
if [[ "$(bws secret list "$project_id" -o json | jq 'length')" != "0" ]]; then
    mise run //:log fatal "Project is not empty, refusing to replace a cluster identity" project "$usage_project"
fi
tmp="$(mktemp -d -p /dev/shm)"
trap 'rm -rf "$tmp"' EXIT
talosctl gen secrets -o "$tmp/bundle.yaml" >/dev/null
while read -r name path; do
    bws secret create -o none -- "$name" "$(yq -er "$path" "$tmp/bundle.yaml")" "$project_id" >/dev/null 2>&1
    mise run //:log info "Stored" name "$name"
done <<'MAP'
MACHINE_TOKEN .trustdinfo.token
MACHINE_CA_CRT .certs.os.crt
MACHINE_CA_KEY .certs.os.key
CLUSTER_ID .cluster.id
CLUSTER_SECRET .cluster.secret
CLUSTER_TOKEN .secrets.bootstraptoken
CLUSTER_SECRETBOXENCRYPTIONSECRET .secrets.secretboxencryptionsecret
CLUSTER_CA_CRT .certs.k8s.crt
CLUSTER_CA_KEY .certs.k8s.key
CLUSTER_AGGREGATORCA_CRT .certs.k8saggregator.crt
CLUSTER_AGGREGATORCA_KEY .certs.k8saggregator.key
CLUSTER_ETCD_CA_CRT .certs.etcd.crt
CLUSTER_ETCD_CA_KEY .certs.etcd.key
CLUSTER_SERVICEACCOUNT_KEY .certs.k8sserviceaccount.key
MAP
'''

# Builds the admin talosconfig at the repo root (git-ignored) from the cluster
# identity in Bitwarden. Endpoints are the control planes, nodes are every
# node, both taken from the files under nodes/.
[tasks.talosconfig]
description = "Generate the admin talosconfig from the cluster identity"
run = '''
cluster="$(mise run //:template cluster.yaml.j2 -D schematic=none | yq -e 'select(.cluster != null) | .cluster')"
name="$(yq -er '.clusterName' <<<"$cluster")"
endpoint="$(yq -er '.controlPlane.endpoint' <<<"$cluster")"
talosctl gen config "$name" "$endpoint" --with-secrets <(mise run //:template secrets.yaml.j2) \
    --output-types talosconfig -o "$TALOSCONFIG" --force
chmod 600 "$TALOSCONFIG"
controlplanes=()
for f in nodes/controlplane/*.yaml.j2; do controlplanes+=("$(basename "$f" .yaml.j2)"); done
nodes=("${controlplanes[@]}")
for f in nodes/workers/*.yaml.j2; do nodes+=("$(basename "$f" .yaml.j2)"); done
talosctl config endpoint "${controlplanes[@]}"
talosctl config node "${nodes[@]}"
mise run //:log info "Wrote talosconfig" endpoints "${controlplanes[*]}" nodes "${nodes[*]}"
'''
