min_version = "2026.11.3"
monorepo_root = true

[env]
FLATE_PATH = "{{config_root}}/kubernetes/apps"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[tools]
"aqua:google/go-containerregistry" = "0.22.1"
"aqua:mitsuhiko/minijinja" = "3.1.0"
bitwarden-secrets-manager = "2.1.0"
cloudflared = "2026.11.0"
flux2 = "2.10.0"
gh = "2.104.0"
"github:home-operations/flate" = "0.7.3"
gitleaks = "8.30.1"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.4"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.13.1"
"npm:oxfmt" = "0.79.0"
shellcheck = "0.11.0"
talosctl = "1.14.6"
yq = "4.54.3"
zizmor = "1.32.0"

# Shell completion runs this outside the task environment, from the caller's directory.
[task_templates.node]
usage = '''
complete "node" run="find \"$(git rev-parse --show-toplevel)/talos/nodes\" -name '*.yaml.j2' ! -name '*.schematic.yaml.j2' -exec basename {} .yaml.j2 \\; | sort"
'''

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

# Renders a template with minijinja; secrets are never stored in this repo.
# `bws run` (Bitwarden Secrets Manager) exposes them to the render as
# environment variables, which templates read as {{ ENV.NAME }}.
# Runs in the caller's directory, so callers pass template paths relative to it.
[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
if [[ -z "${BWS_ACCESS_TOKEN:-}" ]]; then
    BWS_ACCESS_TOKEN="$(<"${BWS_ACCESS_TOKEN_FILE:-$HOME/.config/bws/access-token}")"
    export BWS_ACCESS_TOKEN
fi
bws run -- minijinja-cli --env "$usage_file" "${args[@]}"
'''

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
# A glob skips directories without a mise.toml: bootstrap/, kubernetes/ and
# talos/ are projects. Any other top-level directory with a mise.toml becomes
# one too.
config_roots = ["*"]

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]
task.quiet = true

[hooks]
postinstall = "lefthook install"
